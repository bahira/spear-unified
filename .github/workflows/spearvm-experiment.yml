name: SPEAR optional SpearVM experiment

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'spear/spearvm.py'
      - 'scripts/bench_spearvm.py'
      - 'tests/test_spearvm_adapter.py'
      - '.github/workflows/spearvm-experiment.yml'

permissions:
  contents: read

jobs:
  native-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout pinned SpearVM native source
        uses: actions/checkout@v4
        with:
          repository: bahira/SpearVM
          ref: 113d2e2506e8d50cbb67bcd5563e56968fa0e37c
          path: spearvm-src
      - name: Install NumPy for explicit optional experiment
        run: python -m pip install --disable-pip-version-check 'numpy>=2,<3' wheel setuptools
      - name: Build pinned SpearVM native wheel and install
        run: python spearvm-src/build_package.py --install
      - name: Run adapter contract tests on real native runtime
        run: python -m unittest tests.test_spearvm_adapter -v
      - name: Run measured packed/unpacked/NumPy comparison
        run: python -m scripts.bench_spearvm
