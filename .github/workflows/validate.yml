name: SPEAR validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate Python runtime and discovery
        run: python -m unittest discover -s tests -v
      - name: Measure bounded end-to-end scalar CPU reference
        if: matrix.python-version == '3.12'
        run: python -m scripts.bench_end_to_end --samples 257 --repeats 3 --warmups 1
      - name: Benchmark matched pilot SDK backends
        if: matrix.python-version == '3.12'
        run: python -m scripts.bench_pilot
      - name: Install vectorized baseline for fusion experiment
        if: matrix.python-version == '3.12'
        run: python -m pip install 'numpy>=2,<3'
      - name: Benchmark exact fused C versus Python and NumPy
        if: matrix.python-version == '3.12'
        run: python -m scripts.bench_fused_pipeline
      - name: Reproduce full-paper numerical counterexample
        if: matrix.python-version == '3.12'
        run: python -m scripts.check_paper_claims
      - name: Audit bounded precision with explicit error budget
        if: matrix.python-version == '3.12'
        run: python -m scripts.audit_precision --kernel silu --dtype emulated-f32-step-rounded --abs-tol 1 --probes 257
      - name: Validate native precision experiment
        if: matrix.python-version == '3.12'
        run: python scripts/check_native_precision.py
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Node benchmark tests
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test tests/benchmark.test.mjs
      - name: Smoke-test symbolic regression from samples
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/discover_samples.mjs > /dev/null
